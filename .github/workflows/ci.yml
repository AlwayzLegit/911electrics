name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 9.15.4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile --ignore-workspace

      - name: Typecheck
        run: pnpm typecheck

      - name: Unit tests
        run: pnpm test

    # Note: the production build is validated by the Vercel deployment check on
    # every PR (it needs DATABASE_URL, which isn't available here). Lint is
    # currently skipped pending an eslint-config-next flat-config fix.
